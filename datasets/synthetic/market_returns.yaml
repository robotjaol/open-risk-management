title: Synthetic daily returns for equity, FX and bond assets
kind: synthetic
license: MIT (generated by this repository)
generator: risk_lab.data.synthetic.make_market_returns(n_days=3000, seed=14)
target: none
observation_period: 3000 business days from 2012-01-02 (calendar dates are labels
  only)
generating_process:
  model: GARCH(1,1) with Student t shocks and constant correlation
  parameters:
    equity:
      long_run_vol: 0.011
      alpha: 0.07
      beta: 0.9
      nu: 6.0
      mean: 0.0004
    fx:
      long_run_vol: 0.006
      alpha: 0.05
      beta: 0.91
      nu: 8.0
      mean: 0.0
    bond:
      long_run_vol: 0.004
      alpha: 0.05
      beta: 0.91
      nu: 8.0
      mean: 0.0001
  correlation:
  - - 1.0
    - -0.2
    - -0.3
  - - -0.2
    - 1.0
    - 0.1
  - - -0.3
    - 0.1
    - 1.0
  stress_window: volatility multiplied by 2.2 for business days 2200 to 2259
  note: dates do not match real market history. These are not real prices.
leakage_risks: Rolling VaR must only use returns before the forecast day.
representativeness: Fat tails and volatility clustering are built in. Real markets
  also show jumps, regime shifts and changing correlation, which are not modelled.
