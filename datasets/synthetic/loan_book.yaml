title: Synthetic mixed loan book for IFRS 9 style ECL exercises
kind: synthetic
license: MIT (generated by this repository)
generator: risk_lab.data.synthetic.make_loan_book(n_loans=5000, seed=7)
target: none (PD, LGD and EAD inputs are given, ECL is the output)
observation_period: single reporting date
features:
  segment: retail, sme or mortgage
  ead: exposure at the reporting date
  remaining_years: remaining contractual life in whole years
  eir: effective interest rate, decimal
  pd_origination: 12 month PD when the loan was originated
  pd_current: 12 month PD at the reporting date
  days_past_due: days past due at the reporting date
  lgd: loss given default, decimal
generating_process:
  note: PD at origination by segment with lognormal noise. About 12 percent of loans
    receive a large deterioration shock. Late payments are more likely when current
    PD is high.
leakage_risks: Not applicable, there is no prediction target.
representativeness: Not representative of any real bank. Parameters are round illustrative
  numbers.
name: loan_book
file: datasets/synthetic/loan_book.csv
rows: 5000
columns:
- loan_id
- segment
- ead
- remaining_years
- eir
- pd_origination
- pd_current
- days_past_due
- lgd
