title: Synthetic retail loan development sample
kind: synthetic
license: MIT (generated by this repository)
generator: risk_lab.data.synthetic.make_retail_loans(n_loans=15000, seed=42, drift=0.0)
target: default_12m (1 if the loan defaults within 12 months of origination)
observation_period: none (cross section at origination, no calendar dates)
features:
  age: borrower age in years
  income: annual income, currency units
  employment_years: years in current job
  credit_history_years: length of credit history in years
  dti: debt to income ratio, decimal
  utilization: revolving credit utilisation, decimal
  ltv: loan to value ratio, decimal
  delinq_2y: count of delinquencies in the prior 2 years
  loan_amount: amount borrowed, currency units
  term_months: contract term
  interest_rate: annual contract rate, decimal
  region: one of four labels, carries no signal by design
generating_process:
  true_intercept: -3.1
  true_slopes_on_standardised_features:
    dti_z: 0.55
    utilization_z: 0.4
    ltv_z: 0.3
    log_income_z: -0.45
    credit_history_years_z: -0.25
    delinq_2y_z: 0.5
    interest_rate_z: 0.2
  note: default drawn from a Bernoulli with a logistic probability. region, age, employment_years,
    loan_amount and term_months have zero true effect.
leakage_risks: No feature is built from the target. interest_rate depends on dti and
  delinq_2y, so it is correlated with other features by construction.
representativeness: Not representative of any real portfolio. Use only for learning
  and testing code.
name: retail_loans_dev
file: datasets/synthetic/retail_loans_dev.csv
rows: 15000
columns:
- loan_id
- age
- income
- employment_years
- credit_history_years
- dti
- utilization
- ltv
- delinq_2y
- loan_amount
- term_months
- interest_rate
- region
- default_12m
